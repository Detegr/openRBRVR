name: Build openRBRVR

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y glslang-tools

    - name: Cache Zig compiler
      id: cache-zig
      uses: actions/cache@v6
      with:
        path: zig-x86_64-linux-0.16.0
        key: ${{ runner.os }}-zig-0.16.0

    - name: Download Zig 0.16.0
      if: steps.cache-zig.outputs.cache-hit != 'true'
      run: |
        url='https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz'
        curl -fsSL "$url" -o zig.tar.xz
        tar -xf zig.tar.xz

    - name: Restore Zig cache
      id: zig-cache-restore
      uses: actions/cache/restore@v6
      with:
        path: .zig-cache
        key: ${{ runner.os }}-zig-cache

    - name: Build
      run: ./zig-x86_64-linux-0.16.0/zig build --release=fast

    - name: Cache Zig cache
      if: steps.zig-cache-restore.outputs.cache-hit != 'true'
      id: cache-zig-cache
      uses: actions/cache/save@v6
      with:
        path: .zig-cache
        key: ${{ steps.zig-cache-restore.outputs.cache-primary-key }}

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: openRBRVR
        path: |
          zig-out/**/*
          !zig-out/d3d9.pdb
          !zig-out/Plugins/openRBRVR.pdb

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: openRBRVR-with-pdbs
        path: |
          zig-out/**/*

  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' }}
    needs: build

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v7
      with:
        name: openRBRVR.zip

    - name: Create changelog
      id: changelog
      run: |
        changes=$(awk -v tag=$(git tag --sort=-creatordate | sed -n '2p') '$0 ~ "## " tag {exit} {print}' CHANGELOG.md | sed -e '1,2d')
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        while IFS= read -r line; do
          echo $line >> $GITHUB_ENV
        done <<< "$changes"
        echo EOF >> $GITHUB_ENV

    - name: Create GitHub release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: ${{ env.CHANGELOG }}

    - name: Upload release asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_name: openRBRVR-${{ github.ref_name }}.zip
        asset_path: openRBRVR.zip
        asset_content_type: application/zip

